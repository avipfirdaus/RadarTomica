name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Run P1 extraction eval (mock)
        env:
          LLM_MOCK: '1'
        run: npx tsx src/extract/eval.ts

      - name: Run offline smoke test
        run: npx tsx src/smoke-cli.ts
